name: Quality

on:
  push:
  pull_request:

jobs:
  repository-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate repository structure and examples
        run: python -m unittest discover -s tests -v

